<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Levent Can's site is being rebuilt.">
<meta name="robots" content="index, follow">
<title>Levent Can — Rebuilding</title>
<link rel="icon" href="images/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-top:#1b0b3a;
    --bg-bottom:#0a0417;
    --grid:#ff2ec4;
    --cyan:#2de2ff;
    --magenta:#ff2ec4;
    --violet:#9b5cff;
    --sun-top:#ffd23f;
    --sun-bottom:#ff2ec4;
    --text:#f4eaff;
    --muted:#8f7fb0;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:linear-gradient(180deg,var(--bg-top) 0%,var(--bg-bottom) 55%);
    color:var(--text);
    font-family:'VT323', monospace;
    overflow-x:hidden;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    position:relative;
    text-align:center;
    padding:24px;
  }

  /* scanlines */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    background:repeating-linear-gradient(
      0deg,
      rgba(0,0,0,0.15) 0px,
      rgba(0,0,0,0.15) 1px,
      transparent 2px,
      transparent 3px
    );
    pointer-events:none;
    z-index:10;
    mix-blend-mode:overlay;
  }

  /* stars */
  .stars{
    position:fixed; inset:0;
    background-image:
      radial-gradient(1px 1px at 10% 20%, #fff, transparent),
      radial-gradient(1px 1px at 80% 10%, #fff, transparent),
      radial-gradient(1px 1px at 60% 30%, #fff, transparent),
      radial-gradient(2px 2px at 30% 15%, #fff, transparent),
      radial-gradient(1px 1px at 90% 40%, #fff, transparent),
      radial-gradient(1px 1px at 45% 8%, #fff, transparent),
      radial-gradient(1px 1px at 20% 45%, #fff, transparent),
      radial-gradient(1px 1px at 70% 25%, #fff, transparent);
    opacity:0.5;
    z-index:0;
  }

  .scene{
    position:fixed;
    inset:0;
    z-index:1;
    overflow:hidden;
  }

  .sun{
    position:absolute;
    left:50%;
    top:38%;
    width:min(46vw,420px);
    height:min(46vw,420px);
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:linear-gradient(180deg, var(--sun-top) 0%, var(--sun-bottom) 100%);
    box-shadow:0 0 80px rgba(255,46,196,0.55), 0 0 160px rgba(255,46,196,0.25);
    overflow:hidden;
  }
  .sun::before{
    content:"";
    position:absolute;
    left:0; right:0; bottom:0;
    height:62%;
    background:repeating-linear-gradient(
      0deg,
      var(--bg-bottom) 0px,
      var(--bg-bottom) 6px,
      transparent 6px,
      transparent 16px
    );
  }

  .horizon{
    position:absolute;
    left:0; right:0;
    top:58%;
    height:2px;
    background:var(--cyan);
    box-shadow:0 0 12px var(--cyan), 0 0 30px var(--cyan);
    z-index:2;
  }

  .grid-wrap{
    position:absolute;
    left:0; right:0;
    top:58%;
    bottom:0;
    perspective:220px;
    overflow:hidden;
  }
  .grid{
    position:absolute;
    left:-50%;
    right:-50%;
    top:0;
    bottom:-40%;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size:60px 60px;
    transform:rotateX(75deg);
    transform-origin:top center;
    opacity:0.65;
    animation:gridmove 3s linear infinite;
  }
  @keyframes gridmove{
    from{background-position:0 0, 0 0;}
    to{background-position:0 60px, 0 0;}
  }

  .content{
    position:relative;
    z-index:5;
  }

  .wordmark{
    font-family:'Press Start 2P', monospace;
    font-size:clamp(1.5rem, 6vw, 3.2rem);
    line-height:1.5;
    letter-spacing:2px;
    margin:0 0 18px;
    color:var(--text);
    text-shadow:
      0 0 6px var(--cyan),
      0 0 18px var(--magenta),
      3px 3px 0 var(--violet);
  }

  .status{
    font-family:'Press Start 2P', monospace;
    font-size:clamp(0.6rem, 2vw, 0.85rem);
    color:var(--cyan);
    background:rgba(10,4,23,0.6);
    border:2px solid var(--cyan);
    box-shadow:0 0 10px rgba(45,226,255,0.5), inset 0 0 8px rgba(45,226,255,0.3);
    display:inline-block;
    padding:10px 18px;
    margin-bottom:26px;
    letter-spacing:1px;
  }
  .status .cursor{
    display:inline-block;
    width:0.6em;
    background:var(--cyan);
    margin-left:4px;
    animation:blink 1s steps(1) infinite;
  }
  @keyframes blink{
    50%{ opacity:0; }
  }

  .tagline{
    font-size:clamp(1.2rem, 3vw, 1.6rem);
    color:var(--text);
    max-width:560px;
    margin:0 auto 30px;
    line-height:1.5;
    background:rgba(10,4,23,0.55);
    padding:10px 18px;
    border-radius:4px;
  }
  .tagline .hl{ color:var(--magenta); }

  .progress-label{
    font-size:1.1rem;
    color:var(--muted);
    margin-bottom:8px;
    display:inline-block;
    background:rgba(10,4,23,0.55);
    padding:2px 10px;
    border-radius:3px;
  }
  .progress-bar{
    width:min(70vw,360px);
    height:22px;
    margin:0 auto 34px;
    border:2px solid var(--violet);
    background:rgba(10,4,23,0.6);
    box-shadow:0 0 10px rgba(155,92,255,0.4);
    padding:3px;
  }
  .progress-fill{
    height:100%;
    width:35%;
    background:repeating-linear-gradient(
      90deg,
      var(--magenta) 0px, var(--magenta) 10px,
      var(--violet) 10px, var(--violet) 20px
    );
    box-shadow:0 0 8px var(--magenta);
  }

  .contact{
    font-size:1.3rem;
  }
  .contact a{
    color:var(--sun-top);
    text-decoration:none;
    border-bottom:1px dashed var(--sun-top);
    padding-bottom:2px;
  }
  .contact a:hover{
    color:var(--cyan);
    border-color:var(--cyan);
  }

  .footer{
    margin-top:40px;
    font-size:1rem;
    color:var(--muted);
    letter-spacing:1px;
  }

  @media (max-width:480px){
    .wordmark{ letter-spacing:1px; }
  }
</style>
</head>
<body>
  <div class="stars"></div>
  <div class="scene">
    <div class="sun"></div>
    <div class="grid-wrap"><div class="grid"></div></div>
    <div class="horizon"></div>
  </div>

  <div class="content">
    <h1 class="wordmark">LEVENT&nbsp;CAN</h1>
    <div class="status">STATUS: REBUILDING<span class="cursor">&nbsp;</span></div>
    <p class="tagline">You've found levent-can.com mid-rebuild. A <span class="hl">new site</span> is being built from scratch — data, analysis, and a few working tools included.</p>
    <div class="progress-label">PROGRESS</div>
    <div class="progress-bar"><div class="progress-fill"></div></div>
    <p class="contact">Say hi: <a href="mailto:admin@levent-can.com">admin@levent-can.com</a></p>
    <p class="footer">© 2026 LEVENT CAN — BACK SOON</p>
  </div>
</body>
</html>
